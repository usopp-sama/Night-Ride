name: Orbit Run desktop prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: games/orbit-run
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: games/orbit-run/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run desktop:package:win
      - name: Upload unsigned portable Windows prototype
        uses: actions/upload-artifact@v7
        with:
          name: Orbit-Run-Windows-x64
          path: games/orbit-run/releases/Orbit Run-win32-x64/
          if-no-files-found: error
          retention-days: 14
